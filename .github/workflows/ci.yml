name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Quality gate ────────────────────────────────────────────────────────────
  quality:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --prefer-offline

      - name: TypeScript -no-emit check
        run: node node_modules/typescript/bin/tsc --noEmit

      - name: ESLint
        run: npm run lint

  # ── Build ───────────────────────────────────────────────────────────────────
  build:
    name: Production Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: quality

    env:
      # Minimal build-time Firebase env (public vars only -no secrets needed for build)
      NEXT_PUBLIC_FIREBASE_API_KEY:            ${{ secrets.NEXT_PUBLIC_FIREBASE_API_KEY }}
      NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN:        ${{ secrets.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
      NEXT_PUBLIC_FIREBASE_PROJECT_ID:         ${{ secrets.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
      NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET:     ${{ secrets.NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET }}
      NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
      NEXT_PUBLIC_FIREBASE_APP_ID:             ${{ secrets.NEXT_PUBLIC_FIREBASE_APP_ID }}
      # Dummy values for server vars that env.ts reads at BUILD time
      # (real values are injected at runtime by the deployment environment)
      MONGODB_URI:            "mongodb://localhost:27017/sentinelroute-ci"
      FIREBASE_PROJECT_ID:    "ci-placeholder"
      FIREBASE_CLIENT_EMAIL:  "ci@ci.iam.gserviceaccount.com"
      FIREBASE_PRIVATE_KEY:   "ci-placeholder"
      GEOAPIFY_API_KEY:       "ci-placeholder"
      OPENWEATHER_API_KEY:    "ci-placeholder"
      NEWS_API_KEY:           "ci-placeholder"
      TRAFFIC_API_KEY:        "ci-placeholder"
      DATA_ENCRYPTION_KEY:    "Y2ktcGxhY2Vob2xkZXItMzItYnl0ZXMtZmlsbA=="
      AADHAAR_ENCRYPTION_KEY: "Y2ktcGxhY2Vob2xkZXItMzItYnl0ZXMtZmlsbA=="

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --prefer-offline

      - name: Next.js build
        run: npm run build

  # ── Tests ───────────────────────────────────────────────────────────────────
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: quality

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --prefer-offline

      - name: Run tests
        run: npm run test
